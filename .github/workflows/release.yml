name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Existing version tag, for example v0.1.0
        type: string
        required: true
      artifact:
        description: Source only, unnotarized application, or notarized application
        type: choice
        options: [source-only, unnotarized, notarized]
        default: unnotarized
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  secrets:
    uses: ./.github/workflows/secret-scan.yml
    permissions:
      contents: read
    with:
      ref: ${{ github.event.inputs.version || github.ref_name }}

  verify-source:
    if: github.event_name == 'workflow_dispatch' && inputs.artifact == 'source-only'
    runs-on: macos-15
    env:
      RELEASE_TAG: ${{ github.event.inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Verify release tools
        run: go test ./scripts
      - name: Verify native source and package
        run: |
          test "$(uname -m)" = arm64
          bash mac_app/test.sh
          APP_VERSION="${RELEASE_TAG#v}" bash mac_app/build.sh
          xcrun swift -module-cache-path .build/swift-cache scripts/check-media.swift

  source-release:
    needs: [verify-source, secrets]
    if: github.event_name == 'workflow_dispatch' && inputs.artifact == 'source-only'
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source preview
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]
          git tag --points-at HEAD | grep -Fx "$RELEASE_TAG"
          go test -race ./...
          for test in tests/test_*.cjs; do node "$test"; done
      - name: Publish source-only preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          此标签首次发布为源码预览，未附可安装的 macOS 二进制包。

          GitHub 下方的 Source code 下载来自本标签，不是 Mac 安装包。若需要测试包，请选择明确标记 unnotarized 的预发布附件并阅读安装说明；ad-hoc 签名不代表 Apple 身份认证或公证通过。

          构建、自托管和发行要求见仓库 README 与 docs/RELEASE.md。
          NOTES
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --prerelease --title "$RELEASE_TAG · 源码预览" --notes-file "$RUNNER_TEMP/release-notes.md" --generate-notes
          fi

  preview:
    needs: secrets
    if: github.event_name == 'push' || inputs.artifact == 'unnotarized'
    runs-on: macos-15
    timeout-minutes: 10
    env:
      RELEASE_TAG: ${{ github.event.inputs.version || github.ref_name }}
      SIGNING_IDENTITY: ${{ secrets.DEVELOPMENT_SIGNING_IDENTITY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - name: Set release build number
        run: |
          # 完整源码历史沿主分支递增，避免工作流运行号低于本机测试构建而漏报更新。
          echo "APP_BUILD=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Verify unnotarized release source
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]
          git tag --points-at HEAD | grep -Fx "$RELEASE_TAG"
          bash mac_app/test.sh
          go test -race ./...
          for test in tests/test_*.cjs; do node "$test"; done
      - name: Import fixed Apple Development certificate
        env:
          DEVELOPMENT_CERTIFICATE_P12_BASE64: ${{ secrets.DEVELOPMENT_CERTIFICATE_P12_BASE64 }}
          DEVELOPMENT_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPMENT_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          [[ "$SIGNING_IDENTITY" =~ ^[[:xdigit:]]{40}$ ]]
          test -n "$DEVELOPMENT_CERTIFICATE_P12_BASE64"
          test -n "$DEVELOPMENT_CERTIFICATE_PASSWORD"
          keychain="$RUNNER_TEMP/ipad-development.keychain-db"
          password="$(openssl rand -hex 32)"
          echo "::add-mask::$password"
          printf '%s' "$DEVELOPMENT_CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/development-signing.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/development-signing.p12" -P "$DEVELOPMENT_CERTIFICATE_PASSWORD" -k "$keychain" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
          rm -f "$RUNNER_TEMP/development-signing.p12"
      - name: Package unnotarized application
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: bash mac_app/package-preview.sh "$RELEASE_TAG"
      - name: Publish unnotarized release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          cat > "$RUNNER_TEMP/preview-notes.md" <<'NOTES'
          此发行版面向 Apple Silicon Mac，使用固定 Apple Development 证书签名，保持 App 与后台的更新身份。它不是 Developer ID 签名，也未通过 Apple 公证。GitHub 的普通发行标记不代表 Apple 公证或全部兼容性验收通过。

          优先下载文件名包含 unnotarized 的 DMG，ZIP 作为备用，无需两者都下载。按随附 UNNOTARIZED_INSTALL.md 从 SHA256SUMS 中校验选中的安装包，再将 App 拖入“应用程序”并从该文件夹打开，之后推出镜像。macOS 可能阻止首次打开；只在确认来源后对本 App 单独允许，不需要关闭全局安全保护。构建通过不等于所有 macOS、播放器或独立设备已完成验收。

          本地 App 不依赖 Docker、Python 或 Homebrew。兼容限制与更新说明见仓库 README、docs/RELEASE.md 及 CHANGELOG.md。

          已知问题：后台曾出现读取额度时异常退出，尚未修复；本版没有将这一问题标为解决。
          NOTES
          # GitHub 发行类型只由版本后缀决定，与证书类型、公证状态分别处理。
          create_args=(--latest)
          edit_args=(--prerelease=false --latest)
          if [[ "$version" == *-* ]]; then
            create_args=(--prerelease)
            edit_args=(--prerelease)
          fi
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" ".build/previews/$version/"*
            gh release edit "$RELEASE_TAG" "${edit_args[@]}" --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/preview-notes.md"
          else
            gh release create "$RELEASE_TAG" ".build/previews/$version/"* --verify-tag "${create_args[@]}" --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/preview-notes.md"
          fi
      - name: Remove development signing credentials
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/development-signing.p12"
          security delete-keychain "$RUNNER_TEMP/ipad-development.keychain-db" || true

  release:
    needs: secrets
    if: github.event_name == 'workflow_dispatch' && inputs.artifact == 'notarized'
    runs-on: macos-15
    env:
      RELEASE_TAG: ${{ github.event.inputs.version || github.ref_name }}
      SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
      NOTARY_KEYCHAIN_PROFILE: ipad-release
    steps:
      - name: Require distribution credentials
        shell: bash
        run: |
          set -euo pipefail
          for name in SIGNING_IDENTITY MACOS_CERTIFICATE_P12_BASE64 MACOS_CERTIFICATE_PASSWORD APPLE_API_KEY_P8_BASE64 APPLE_API_KEY_ID APPLE_API_ISSUER_ID; do
            if [[ -z "${!name}" ]]; then printf 'Missing required release secret: %s\n' "$name" >&2; exit 1; fi
          done
          test "$(uname -m)" = arm64
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - name: Set release build number
        run: |
          # 公证与未公证发行使用同一构建号规则。
          echo "APP_BUILD=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Verify release source
        run: |
          bash mac_app/test.sh
          go test -race ./...
          for test in tests/test_*.cjs; do node "$test"; done
      - name: Prepare temporary signing keychain
        shell: bash
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/ipad-release.keychain-db"
          password="$(openssl rand -hex 32)"
          echo "::add-mask::$password"
          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/signing.p12" -P "$MACOS_CERTIFICATE_PASSWORD" -k "$keychain" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
          xcrun notarytool store-credentials "$NOTARY_KEYCHAIN_PROFILE" --key "$RUNNER_TEMP/notary.p8" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" --keychain "$keychain"
          echo "NOTARY_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/signing.p12" "$RUNNER_TEMP/notary.p8"
      - name: Build, notarize and package
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: bash mac_app/release.sh "$RELEASE_TAG"
      - name: Publish verified artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          args=(--verify-tag --title "$RELEASE_TAG" --generate-notes)
          if [[ "$version" == *-* ]]; then args+=(--prerelease); fi
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" ".build/releases/$version/"*
          else
            gh release create "$RELEASE_TAG" ".build/releases/$version/"* "${args[@]}"
          fi
      - name: Remove temporary credentials
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/signing.p12" "$RUNNER_TEMP/notary.p8"
          security delete-keychain "$RUNNER_TEMP/ipad-release.keychain-db" || true
