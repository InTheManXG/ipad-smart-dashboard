name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Existing version tag, for example v0.1.0-beta.1
        type: string
        required: true
      artifact:
        description: Source preview or a notarized macOS application
        type: choice
        options: [source-only, notarized]
        default: source-only
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  secrets:
    uses: ./.github/workflows/secret-scan.yml
    permissions:
      contents: read
    with:
      ref: ${{ github.event.inputs.version || github.ref_name }}

  verify-source:
    if: github.event_name == 'push' || inputs.artifact == 'source-only'
    runs-on: macos-15
    env:
      RELEASE_TAG: ${{ github.event.inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Verify native source and package
        run: |
          test "$(uname -m)" = arm64
          bash mac_app/test.sh
          APP_VERSION="${RELEASE_TAG#v}" bash mac_app/build.sh

  source-release:
    needs: [verify-source, secrets]
    if: github.event_name == 'push' || inputs.artifact == 'source-only'
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source preview
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]
          git tag --points-at HEAD | grep -Fx "$RELEASE_TAG"
          python3 -m unittest discover -s tests -p 'test_*.py'
          python3 scripts/check-release.py
          for test in tests/test_*.cjs; do node "$test"; done
      - name: Publish source-only preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          此标签首次发布为源码预览，未附可安装的 macOS 二进制包。

          GitHub 下方的 Source code 下载来自本标签，不是 Mac 安装包。后续只有完成 Developer ID 签名、公证及验证后才会添加 macOS ZIP 与 SHA256SUMS 附件；自行构建的 ad-hoc 包仅供开发测试。

          构建、自托管和发行要求见仓库 README 与 docs/RELEASE.md。
          NOTES
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --prerelease --title "$RELEASE_TAG · 源码预览" --notes-file "$RUNNER_TEMP/release-notes.md" --generate-notes
          fi

  release:
    needs: secrets
    if: github.event_name == 'workflow_dispatch' && inputs.artifact == 'notarized'
    runs-on: macos-15
    env:
      RELEASE_TAG: ${{ github.event.inputs.version || github.ref_name }}
      SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
      NOTARY_KEYCHAIN_PROFILE: ipad-release
      APP_BUILD: ${{ github.run_number }}
    steps:
      - name: Require distribution credentials
        shell: bash
        run: |
          set -euo pipefail
          for name in SIGNING_IDENTITY MACOS_CERTIFICATE_P12_BASE64 MACOS_CERTIFICATE_PASSWORD APPLE_API_KEY_P8_BASE64 APPLE_API_KEY_ID APPLE_API_ISSUER_ID; do
            if [[ -z "${!name}" ]]; then printf 'Missing required release secret: %s\n' "$name" >&2; exit 1; fi
          done
          test "$(uname -m)" = arm64
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify release source
        run: |
          bash mac_app/test.sh
          python3 -m unittest discover -s tests -p 'test_*.py'
          python3 scripts/check-release.py
          for test in tests/test_*.cjs; do node "$test"; done
      - name: Prepare temporary signing keychain
        shell: bash
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/ipad-release.keychain-db"
          password="$(openssl rand -hex 32)"
          echo "::add-mask::$password"
          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/signing.p12" -P "$MACOS_CERTIFICATE_PASSWORD" -k "$keychain" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
          xcrun notarytool store-credentials "$NOTARY_KEYCHAIN_PROFILE" --key "$RUNNER_TEMP/notary.p8" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" --keychain "$keychain"
          echo "NOTARY_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/signing.p12" "$RUNNER_TEMP/notary.p8"
      - name: Build, notarize and package
        run: bash mac_app/release.sh "$RELEASE_TAG"
      - name: Publish verified artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          args=(--verify-tag --title "$RELEASE_TAG" --generate-notes)
          if [[ "$version" == *-* ]]; then args+=(--prerelease); fi
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" ".build/releases/$version/"*
          else
            gh release create "$RELEASE_TAG" ".build/releases/$version/"* "${args[@]}"
          fi
      - name: Remove temporary credentials
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/signing.p12" "$RUNNER_TEMP/notary.p8"
          security delete-keychain "$RUNNER_TEMP/ipad-release.keychain-db" || true
