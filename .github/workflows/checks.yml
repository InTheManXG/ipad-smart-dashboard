name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    uses: ./.github/workflows/secret-scan.yml

  server-and-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test server and web
        run: |
          go test -race ./...
          python3 scripts/check-release.py
          for test in tests/test_*.cjs; do node "$test"; done
      - name: Validate standalone server image
        run: |
          docker compose -f deploy/compose.yaml config --quiet
          docker compose -f deploy/compose.yaml build
          docker compose -f deploy/compose.yaml up -d --wait --wait-timeout 60
          curl --fail http://127.0.0.1:18086/api/mode
      - name: Clean server fixture
        if: always()
        run: docker compose -f deploy/compose.yaml down --volumes

  macos-arm64:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Verify runner architecture
        run: test "$(uname -m)" = arm64
      - name: Native regression tests
        run: bash mac_app/test.sh
      - name: Build without private signing credentials
        run: bash mac_app/build.sh
      - name: Validate signatures
        run: codesign --verify --deep --strict '.build/iPad 控制台.app'
      - name: Load packaged media adapter
        run: python3 scripts/check-media.py
      - name: Verify disk image and copied application
        run: bash mac_app/package-dmg.sh '.build/iPad 控制台.app' '.build/check-installer.dmg'
