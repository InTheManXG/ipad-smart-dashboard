<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#f7f7f8"><link rel="manifest" href="./manifest.json"><link rel="icon" href="./codex-icon.png"><link rel="apple-touch-icon" href="./codex-icon.png"><link rel="stylesheet" href="./style.css"><title>Codex · 工作现场</title></head>
<body>
<div class="pages" tabindex="0" aria-label="看板页面"><div class="dashboard-page home-page">
<header>
  <div class="brand"><img class="logo" src="./codex-icon.png" alt=""><div><h1>Codex</h1><span class="sub">工作看板</span></div></div>
  <aside class="header-quota" aria-label="订阅等级">
    <div class="quota-label"><span id="plan" class="plan">—</span></div>
    <div id="windows"></div><p id="quota-note">等待读取</p>
  </aside>
  <div class="top"><span id="connection" class="disconnected" role="status">正在连接</span><time id="clock"></time><button id="more-settings" class="more-button" popovertarget="display-options" aria-label="更多设置">⋮</button><div id="display-options" popover aria-label="显示设置"><button id="connect">连接设置</button><button id="fullscreen">全屏显示</button><button id="wake" aria-pressed="true">常亮待恢复</button><button id="refresh">刷新数据</button><button id="reload">重新加载页面</button></div></div>
</header>
<main>
  <section class="tasks">
    <div class="section-head"><div><h2>任务现场</h2><p id="summary" class="section-description">等待第一份状态</p></div><span id="task-count">—</span></div>
    <div id="task-list" aria-live="polite"></div><p id="list-note" class="note"></p>
  </section>
</main>
<footer><span id="footer-note" role="status"></span></footer>
<section class="music-panel" aria-label="正在播放的歌词">
  <div class="music-meta"><div><span class="music-label">正在聆听</span><h2 id="music-title">等待音乐响起</h2><p id="music-artist">在 Mac 上播放音乐，歌词会出现在这里</p></div><span id="music-state" role="status">未连接</span></div>
  <div class="lyric-lines" aria-live="off"><div id="lyric-track"><p class="lyric-line active">♪</p></div></div>
</section>
</div>
<section id="company" class="dashboard-page company-page" aria-labelledby="company-title">
  <div class="section-head"><div><h2 id="company-title">公司中转站</h2><p class="section-description">订阅额度 · 每分钟更新</p></div><div class="relay-actions"><button id="relay-refresh" type="button">更新</button><button id="relay-manage">管理 Key</button></div></div>
  <p id="relay-message" class="note" role="status"></p><div id="relay-cards"></div>
</section></div>
<dialog id="relay-settings" aria-labelledby="relay-settings-title">
  <h2 id="relay-settings-title">管理 Key</h2><div id="relay-key-list"></div>
  <form id="relay-form"><input id="relay-id" type="hidden"><label>备注名<input id="relay-name" required maxlength="60" autocomplete="off"></label><label>API Key<input id="relay-key" type="password" maxlength="512" autocomplete="off" spellcheck="false" placeholder="输入 Key；编辑时留空保留原值"></label>
  <p id="relay-form-message" role="status"></p><div class="dialog-actions"><button type="button" id="relay-new">新增</button><button type="button" id="relay-close">关闭</button><button id="relay-save" type="submit">保存</button></div></form>
</dialog>
<dialog id="settings"><form id="settings-form"><h2>连接你的 Codex</h2><p>输入此 Mac 上生成的看板访问口令。</p><label>访问口令<input id="token" type="password" autocomplete="off" required></label><div class="dialog-actions"><button type="button" id="cancel">取消</button><button type="submit">连接</button></div></form></dialog>
<dialog id="attention-dialog" aria-labelledby="attention-heading" aria-describedby="attention-title">
  <div class="attention-brand"><img src="./codex-icon.png" alt="" width="36" height="36"><span>Codex</span><span class="attention-status"><i aria-hidden="true"></i>等待你处理</span></div>
  <div class="attention-content">
    <div class="attention-beacon" aria-hidden="true"><span>!</span></div>
    <h2 id="attention-heading" tabindex="-1" autofocus>需要你来接手</h2>
    <div class="attention-task"><span class="attention-task-label">当前对话</span><p id="attention-title"></p></div>
    <p id="open-result" role="status"></p>
  </div>
  <div class="dialog-actions"><button id="attention-dismiss">稍后处理</button><button id="open-codex">打开 Codex <span aria-hidden="true">↗</span></button></div>
</dialog>
<script src="./app.js" type="module"></script><script src="./relay.js" type="module"></script><script src="./music.js" type="module"></script></body></html>
