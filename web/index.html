<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#f7f7f8"><link rel="manifest" href="./manifest.json"><link rel="icon" href="./app-icon.png"><link rel="apple-touch-icon" href="./app-icon.png"><link rel="stylesheet" href="./style.css"><title>iPad 控制台 · 工作看板</title></head>
<body>
<dialog id="console-confirm" aria-labelledby="console-confirm-name" aria-describedby="console-confirm-target console-confirm-description">
  <h2 id="console-confirm-name">执行快捷项目？</h2>
  <p id="console-confirm-target" hidden></p>
  <p id="console-confirm-description">由配对的 Mac 在后台执行。</p>
  <div class="dialog-actions"><button id="console-confirm-cancel" type="button">取消</button><button id="console-confirm-run" type="button">执行</button></div>
</dialog>
<div class="pages" tabindex="0" aria-label="看板页面">
<section id="console" class="dashboard-page console-page" aria-labelledby="console-title">
  <h1 id="console-title">快捷控制台</h1>
  <section class="console-shortcuts" aria-labelledby="console-shortcuts-title">
    <div class="section-head"><h2 id="console-shortcuts-title">快捷操作</h2><button id="console-refresh" type="button">刷新</button></div>
    <p id="console-status" class="note" role="status">正在连接 Mac…</p>
    <div id="console-actions" class="console-actions"></div>
  </section>
</section>
<div id="home" class="dashboard-page home-page music-hidden">
<header>
  <div class="brand"><img class="logo" src="./app-icon.png" alt=""><div><h1>iPad 控制台</h1><span class="sub">工作看板</span></div></div>
  <aside class="header-quota" aria-label="订阅等级">
    <div class="quota-label"><span id="plan" class="plan">—</span></div>
    <div id="windows"></div><p id="quota-note">等待读取</p>
  </aside>
  <div class="top"><span id="connection" class="disconnected" role="status">正在连接</span><time id="clock"></time><button id="more-settings" class="more-button" aria-controls="display-options" aria-expanded="false" aria-label="更多设置">⋮</button><div id="display-options" hidden role="group" aria-label="显示设置"><button id="connect">连接设置</button><button id="fullscreen">全屏显示</button><button id="wake" aria-pressed="false">开启常亮</button><button id="refresh">刷新数据</button><button id="reload">重新加载页面</button></div></div>
</header>
<main>
  <section class="tasks">
    <div class="section-head"><div><h2>任务现场</h2><p id="summary" class="section-description">等待第一份状态</p></div><a class="music-page-open" href="#music">音乐 <span aria-hidden="true">→</span></a><span id="task-count">—</span></div>
    <div id="task-list" aria-live="polite"></div><p id="list-note" class="note"></p>
  </section>
</main>
<footer><span id="footer-note" role="status"></span></footer>
<section id="music-panel" class="music-panel" hidden aria-label="正在播放的歌词">
  <div class="music-source" aria-label="音乐来源"><img id="music-source-logo" class="music-source-logo" src="./music-note.svg" alt="" aria-hidden="true" width="24" height="24" hidden><span id="music-source">网易云音乐</span></div>
  <button id="music-previous" class="music-control" type="button" aria-label="上一曲" title="上一曲" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5v14M18 5l-9 7 9 7z"/></svg></button>
  <button id="music-replay" class="music-control" type="button" aria-label="重播" title="从头播放" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10a8 8 0 1 1 1 7M4 4v6h6"/></svg></button>
  <div class="music-meta"><h2 id="music-title">等待音乐响起</h2><p id="music-artist">在 Mac 上播放音乐，歌词会出现在这里</p></div>
  <div class="music-timeline"><span id="music-elapsed" class="music-time" aria-label="已播放时间">--:--</span><progress id="music-progress" max="1" value="0" aria-label="歌曲播放进度"></progress><span id="music-duration" class="music-time" aria-label="总时长">--:--</span></div>
  <div class="lyric-lines" aria-live="off"><div id="lyric-track"><p class="lyric-line active">♪</p></div></div>
  <button id="music-toggle" class="music-control" type="button" aria-label="播放" title="播放" data-playing="false" disabled><svg class="play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5 11 7-11 7z"/></svg><svg class="pause-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14"/></svg></button>
  <button id="music-next" class="music-control" type="button" aria-label="下一曲" title="下一曲" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 5v14M6 5l9 7-9 7z"/></svg></button>
  <p id="music-control-result" role="status"></p>
</section>
</div>
<section id="music" class="dashboard-page music-page" hidden aria-label="音乐"></section>
<section id="company" class="dashboard-page company-page" aria-labelledby="company-title">
  <div class="section-head"><div><h2 id="company-title">中转站key 额度信息</h2><p class="section-description">订阅额度 · 每分钟更新 · Key 请在 Mac 控制台管理</p></div><div class="relay-actions"><button id="relay-refresh" type="button">更新</button></div></div>
  <p id="relay-message" class="note" role="status"></p><div id="relay-cards"></div>
</section></div>
<dialog id="wake-dialog" aria-labelledby="wake-heading" aria-describedby="wake-message">
  <button id="restore-wake"><span id="wake-heading">点击任意位置恢复常亮</span><span id="wake-message">常亮已中断</span></button>
</dialog>
<dialog id="settings"><form id="settings-form"><h2>配对你的 Mac App</h2><p>在 Mac App 的“网页配对”区域找到 8 位配对码，输入后显示对应内容。</p><label>配对码<input id="token" inputmode="text" autocomplete="one-time-code" maxlength="8" required></label><p id="pairing-error" class="note" role="alert"></p><div class="dialog-actions"><button type="button" id="cancel">取消</button><button type="submit">完成配对</button></div></form></dialog>
<dialog id="attention-dialog" aria-labelledby="attention-heading" aria-describedby="attention-title">
  <div class="attention-card">
  <div class="attention-content">
    <div class="attention-beacon" aria-hidden="true"><img src="./app-icon.png" alt="" width="140" height="140"></div>
    <h2 id="attention-heading" tabindex="-1" autofocus>需要你处理</h2>
    <p id="attention-title"></p>
    <p id="open-result" role="status"></p>
  </div>
  <button id="open-codex" aria-label="打开对应 Codex 对话">打开 Codex</button>
  </div>
  <button id="attention-dismiss">稍后处理</button>
</dialog>
<script src="./app.js" type="module"></script><script src="./relay.js" type="module"></script><script src="./music.js" type="module"></script><script src="./console.js" type="module"></script></body></html>
