services:
  ipad-dashboard:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: ipad-smart-dashboard:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-18086}:18086"
    environment:
      DISPLAY_MODE: pairing
      DISPLAY_BIND: 0.0.0.0
      RELAY_DATA_DIR: /relay-data
      # 仅在入口是可信反代且直接覆盖 X-Real-IP 时设为 1。
      PAIRING_TRUST_PROXY: ${PAIRING_TRUST_PROXY:-0}
    volumes:
      - relay-data:/relay-data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128

# Docker 首次创建命名卷会继承镜像目录的非 root 所有者。
volumes:
  relay-data:
